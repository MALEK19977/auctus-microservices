server:
  port: 8080

spring:
  application:
    name: api-gateway
  codec:
    # The gateway buffers uploaded cheque images; the 256KB default is far too small.
    max-in-memory-size: 20MB
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authService
                fallbackUri: forward:/fallback/auth

        - id: cheque-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/cheque/**
          filters:
            - name: CircuitBreaker
              args:
                name: chequeService
                fallbackUri: forward:/fallback/cheque

        - id: client-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/client/**
          filters:
            - name: CircuitBreaker
              args:
                name: clientService
                fallbackUri: forward:/fallback/client

        - id: collab-messages
          uri: http://localhost:8087
          predicates:
            - Path=/api/messages/**
          filters:
            - name: CircuitBreaker
              args:
                name: collabService
                fallbackUri: forward:/fallback/collab

        - id: collab-appointments
          uri: http://localhost:8087
          predicates:
            - Path=/api/appointments/**
          filters:
            - name: CircuitBreaker
              args:
                name: collabService
                fallbackUri: forward:/fallback/collab

        - id: ocr-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/ocr/**
          filters:
            - name: CircuitBreaker
              args:
                name: ocrService
                fallbackUri: forward:/fallback/ocr

        - id: qr-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/qr/**
          filters:
            - name: CircuitBreaker
              args:
                name: qrService
                fallbackUri: forward:/fallback/qr

        - id: signature-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/signature/**
          filters:
            - name: CircuitBreaker
              args:
                name: signatureService
                fallbackUri: forward:/fallback/signature

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:eureka123@localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info