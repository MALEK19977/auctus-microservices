server:
  port: 8087

spring:
  application:
    name: COLLAB-SERVICE
  servlet:
    multipart:
      # Scans, photos of cheques and voice notes all arrive through here.
      max-file-size: 15MB
      max-request-size: 20MB
  datasource:
    url: ${CHEQUE_DB_URL:jdbc:postgresql://localhost:5432/cheque_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:eureka123@localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true

collab:
  # Task documents, shared images and voice notes. Kept out of the repository by
  # .gitignore - these are real customer files.
  upload-dir: ${AUCTUS_UPLOAD_DIR:../../uploads}
