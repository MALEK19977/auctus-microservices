server:
  port: 8083

spring:
  application:
    name: OCR-SERVICE
  servlet:
    multipart:
      # Photos of cheques taken with a phone routinely exceed the 1MB default.
      max-file-size: 15MB
      max-request-size: 20MB

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:eureka123@localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true

python:
  script:
    path: src/main/python/scripts/cheque_detector.py