server:
  port: 8085

spring:
  application:
    name: SIGNATURE-SERVICE
  servlet:
    multipart:
      # Photos of cheques taken with a phone routinely exceed the 1MB default.
      max-file-size: 15MB
      max-request-size: 20MB

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:eureka123@localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true

python:
  # Leave blank to auto-detect (python / py / python3).
  command: ${PYTHON_COMMAND:}
  script:
    matcher: src/main/python/scripts/signature_matcher.py

signature:
  # Relative to the repository by default; override AUCTUS_DATA_DIR to use a
  # dataset kept outside it.
  # Same store the client register serves specimens from. Resolved from this
  # service working directory (backend/signature-service).
  reference-folder: ${AUCTUS_SIGNATURES_DIR:../signatures/extract}
  csv:
    # Master client file: maps a client (by RIB or name) to their enrolled signature.
    path: ${AUCTUS_DATA_DIR:../../cheque_generator}/output/clients_master.csv

services:
  # The client register knows which specimen belongs to which account. Asking it
  # keeps one source of truth instead of a second CSV that drifts out of date.
  client:
    url: ${CLIENT_SERVICE_URL:http://localhost:8086}
